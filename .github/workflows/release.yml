name: Release

# Releases are deliberate: pushing a vX.Y.Z tag is the only trigger.
#
# TWO tarballs, because this package has two consumers wanting different things
# and one artefact cannot serve both:
#
#   timeflare-sdk-<tag>.tgz              dist only, npm-pack shaped
#   timeflare-sdk-examples-<tag>.tar.gz  dist + examples + wasm, for the e2e harness
#
# The split is a dependency boundary. The first is what a consumer resolves as
# `@timeflareio/typescript-sdk`, so it carries package content and nothing else:
# the WASM is a declared dependency on `@timeflareio/crypto` rather than bundled
# here, and examples are not package content at all. The second exists because
# the chain's e2e harness runs the examples, which the package has no reason to
# ship.
#
# npm records the integrity hash of whatever it fetched, so the first artefact
# does not need to be byte-reproducible between builds — it needs to stay
# unreplaced once published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Enforce the version policy
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v0.*) echo "✅ ${GITHUB_REF_NAME} is within the 0.x policy" ;;
            *)
              echo "::error::${GITHUB_REF_NAME} crosses out of 0.x. Registry publication and the compatibility promise that implies are deliberately deferred — see docs/planning/PENDING_RELEASE_STRATEGY_PLAN.md."
              exit 1
              ;;
          esac

      # A consumer resolves this package by URL and records the tarball's own
      # identity in its lockfile, so a manifest version that disagrees with the
      # tag would put two different answers in circulation for one release.
      - name: Assert the manifest version matches the tag
        run: |
          set -euo pipefail
          declared="$(node -p "require('./package.json').version")"
          expected="${GITHUB_REF_NAME#v}"
          echo "package.json: ${declared} · tag: ${expected}"
          [ "${declared}" = "${expected}" ] || {
            echo "::error::package.json declares ${declared} but this release is ${expected}. Bump the version in the commit you tag."
            exit 1; }
          echo "✅ manifest and tag agree on ${expected}"

      - run: npm ci

      - name: Fetch the pinned WASM bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: make wasm-sync

      # Full gate before publishing: lint, types, both vendored corpora checked
      # against their owning repositories, then the suite.
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify

      - name: Build
        run: npm run build

      - name: Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: make test

      - name: Pack the dist tarball
        run: |
          set -euo pipefail
          mkdir -p dist-release
          stage="$(mktemp -d)"
          cp -R dist "${stage}/"
          cp package.json "${stage}/"
          if [ -f README.md ]; then cp README.md "${stage}/"; fi
          # Restrict the packed fileset to dist/, dropping wasm/ from `files`.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('${stage}/package.json'));p.files=['dist/'];fs.writeFileSync('${stage}/package.json',JSON.stringify(p,null,2)+'\n')"
          ( cd "${stage}" && npm pack >/dev/null )
          # npm names the tarball after the package, scope included; the asset name
          # is what consumers resolve, so it stays as it is.
          mv "${stage}"/*.tgz "dist-release/timeflare-sdk-${GITHUB_REF_NAME}.tgz"

      # A consumer resolves this asset and reads the chain vectors out of it, so
      # assert the identity and the payload rather than trusting the pack.
      - name: Assert the packed identity and payload
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "dist-release/timeflare-sdk-${GITHUB_REF_NAME}.tgz" -C "$tmp"
          name="$(node -p "require('$tmp/package/package.json').name")"
          version="$(node -p "require('$tmp/package/package.json').version")"
          echo "packaged: ${name}@${version}"
          [ "${name}" = "@timeflareio/typescript-sdk" ] || {
            echo "::error::package name is '${name}'"; exit 1; }
          [ "${version}" = "${GITHUB_REF_NAME#v}" ] || {
            echo "::error::package version is '${version}'"; exit 1; }
          for v in client_conventions creation_fee dials share_band tx_gas wallet_derivation; do
            [ -f "$tmp/package/dist/vendor/vectors/${v}.json" ] || {
              echo "::error::dist/vendor/vectors/${v}.json is absent from the package"; exit 1; }
          done
          echo "✅ ${name}@${version} carries the chain-semantics vectors"

      - name: Pack the examples bundle
        run: |
          set -euo pipefail
          stage="$(mktemp -d)/timeflare-sdk"
          mkdir -p "${stage}"
          cp -R dist examples wasm package.json "${stage}/"
          tar -czf "dist-release/timeflare-sdk-examples-${GITHUB_REF_NAME}.tar.gz" \
            -C "$(dirname "${stage}")" timeflare-sdk
          ( cd dist-release && sha256sum ./* > "timeflare-sdk-${GITHUB_REF_NAME}-checksums.txt" )
          ls -la dist-release/

      - name: Compose release notes
        run: |
          set -euo pipefail
          crypto="$(grep -E '^CRYPTO_VERSION=' versions.env | cut -d= -f2)"
          chain="$(grep -E '^CHAIN_VERSION=' versions.env | cut -d= -f2)"
          {
            echo "## Artefacts"
            echo
            echo "| Artefact | For |"
            echo "|---|---|"
            echo "| \`timeflare-sdk-${GITHUB_REF_NAME}.tgz\` | consumers vendoring the package — dist only, byte-deterministic so a committed lockfile's integrity hash stays valid |"
            echo "| \`timeflare-sdk-examples-${GITHUB_REF_NAME}.tar.gz\` | the chain's e2e harness — dist + examples + WASM |"
            echo
            echo "Two tarballs because the consumers want different things: the mobile"
            echo "client needs a reproducible artefact, and \`wasm-opt\` output is not"
            echo "byte-reproducible, so WASM ships only in the second."
            echo
            echo "Not published to a registry — deliberately deferred."
            echo
            echo "## Assembled from"
            echo
            echo "| Source | Version |"
            echo "|---|---|"
            echo "| \`timeflareio/crypto\` (WASM + primitive vectors) | \`${crypto}\` |"
            echo "| \`timeflareio/chain\` (protobufs + chain-semantics vectors) | \`${chain}\` |"
            echo
            echo "\`make verify\` passed on this commit, so both vendored corpora were"
            echo "checked against those repositories — crypto's against its SHA-256"
            echo "manifest, the chain's against its tag."
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist-release/*
