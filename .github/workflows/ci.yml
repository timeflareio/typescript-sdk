name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  sdk:
    name: SDK (verify + test)
    needs: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # No Rust toolchain here, and nothing to fetch: the WASM bundle arrives as
      # the @timeflareio/crypto dependency that `npm ci` above installed, with the
      # lockfile's integrity hash covering it. Contributors need only Node.

      # vectors-verify re-reads the chain's release, so this proves the vendored
      # copies still match its manifest — not merely that some files are present.
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify

      - name: Build
        run: npm run build

      - name: Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: make test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
